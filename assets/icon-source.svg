<?xml version="1.0" encoding="UTF-8"?>
<!--
  PWA app icon for the Washington Cascades Adventure Route trip site.

  This SVG is the design reference. The shipped PNGs are rasterized by
  scripts/build_pwa_icons.py, which draws the same primitives directly with
  Pillow rather than reading this file -- so if you change one, change both.
  The year text is read from trip_config.TRIP_DATE_START in the Python.

  Design: moon over three snow-capped volcanic cones (Mount St Helens blunt on
  the left, Mount Rainier tallest in the centre, Mount Adams broad on the
  right), an evergreen treeline, and a warm route line arcing through the
  forest. Square 512 viewport with all meaningful content inside the inner
  ~80% so it survives the maskable safe-zone crop on Android.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a3c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="peaks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2ecf5"/>
      <stop offset="100%" stop-color="#4a6984"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#204e3e"/>
      <stop offset="100%" stop-color="#10261e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffebba" stop-opacity="1"/>
      <stop offset="100%" stop-color="#96bedc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <circle cx="256" cy="210" r="70" fill="url(#moon)"/>

  <!-- Three cones. Kept as one path so the snow gradient reads continuously. -->
  <path fill="url(#peaks)" d="
    M30 400
    L96 300 L120 288 L150 300
    L196 372
    L250 250 L256 240 L262 250
    L318 366
    L368 292 L392 282 L404 288 L420 300
    L482 400
    Z"/>

  <!-- Evergreen treeline: alternating sawtooth between y=380 and y=404. -->
  <path fill="url(#forest)" d="
    M30 470 L482 470 L482 396
    L464 380 L446 404 L428 380 L410 404 L392 380 L374 404 L356 380 L338 404
    L320 380 L302 404 L284 380 L266 404 L248 380 L230 404 L212 380 L194 404
    L176 380 L158 404 L140 380 L122 404 L104 380 L86 404 L68 380 L50 404
    L32 380 L30 404
    Z"/>

  <!-- Route line arcing through the forest band. -->
  <path fill="none" stroke="#f5b052" stroke-width="9" stroke-linecap="round"
        d="M60 452 C120 436 170 424 215 420 C258 416 300 410 338 416 C378 422 418 434 458 448"/>

  <text x="256" y="466" text-anchor="middle" fill="#e2ecf5"
        font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">2026</text>
</svg>
